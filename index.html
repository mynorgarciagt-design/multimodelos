<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODELOS MULTI — Archivos</title>

<script>
(function(){
  try {
    var t = localStorage.getItem('mm_theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  [data-theme="light"] {
    --bg:#FFFFFF; --panel:#F7F5F2; --surface:#FFFFFF; --hover:#F4F2EF; --selected:#EAF2FF;
    --border:#E8E5E1; --border-2:#DBD8D3; --text:#1E1919; --text-2:#6F6B67; --text-3:#A39E99;
    --blue:#0061FF; --blue-hover:#0053DB; --blue-soft:#EAF2FF; --red:#D93D2E; --red-soft:#FCEEEC; --green:#1A8754;
    --shadow:0 6px 24px rgba(0,0,0,.13); --shadow-sm:0 1px 3px rgba(0,0,0,.10); --overlay:rgba(30,25,25,.45);
  }
  [data-theme="dark"] {
    --bg:#1A1A1C; --panel:#222225; --surface:#222225; --hover:#2A2A2E; --selected:#1C3357;
    --border:#34343A; --border-2:#45454C; --text:#ECECEE; --text-2:#9C9CA3; --text-3:#6C6C73;
    --blue:#4C9AFF; --blue-hover:#3D8BFF; --blue-soft:rgba(76,154,255,.14); --red:#FF6B5C; --red-soft:rgba(255,107,92,.14); --green:#3BD37E;
    --shadow:0 8px 30px rgba(0,0,0,.55); --shadow-sm:0 1px 3px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6);
  }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; transition:background .2s,color .2s; }
  button { font-family:inherit; cursor:pointer; }

  /* LOGIN */
  #login { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:28px; padding:24px; }
  .login-brand { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .login-logo { width:56px; height:56px; }
  .login-title { font-size:24px; font-weight:700; letter-spacing:-0.4px; }
  .login-sub { font-size:13px; color:var(--text-2); margin-top:-8px; }
  .pin-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 36px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:22px; box-shadow:var(--shadow-sm); }
  .pin-label { font-size:13px; color:var(--text-2); text-align:center; font-weight:500; }
  .pin-dots { display:flex; justify-content:center; gap:14px; }
  .dot { width:13px; height:13px; border-radius:50%; border:2px solid var(--border-2); transition:all .15s; }
  .dot.filled { background:var(--blue); border-color:var(--blue); transform:scale(1.05); }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key { background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:19px; font-weight:500; padding:15px 0; transition:all .1s; }
  .key:hover { background:var(--hover); }
  .key:active { transform:scale(.94); background:var(--blue-soft); border-color:var(--blue); }
  .key.zero { grid-column:2; }
  .key.del { background:transparent; border-color:transparent; color:var(--text-3); font-size:16px; }
  .key.del:hover { color:var(--red); background:var(--red-soft); }
  .pin-hint { font-size:11.5px; color:var(--text-3); text-align:center; margin-top:-8px; }
  .pin-err { font-size:12px; color:var(--red); text-align:center; min-height:15px; font-weight:500; }

  /* APP */
  #app { display:none; flex-direction:column; flex:1; min-height:100vh; }
  header { background:var(--bg); border-bottom:1px solid var(--border); height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:20; }
  .hdr-left { display:flex; align-items:center; gap:11px; }
  .hdr-logo { width:26px; height:26px; }
  .hdr-name { font-size:16px; font-weight:700; letter-spacing:-0.3px; }
  .hdr-right { display:flex; align-items:center; gap:8px; }
  .icon-btn { width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:transparent; border:1px solid transparent; border-radius:9px; color:var(--text-2); transition:all .15s; }
  .icon-btn:hover { background:var(--hover); color:var(--text); }
  .icon-btn svg { width:19px; height:19px; }
  .btn-text { background:transparent; border:1px solid var(--border-2); border-radius:9px; color:var(--text-2); font-size:13px; font-weight:500; padding:8px 14px; transition:all .15s; }
  .btn-text:hover { background:var(--hover); color:var(--text); border-color:var(--text-3); }
  .container { flex:1; width:100%; max-width:960px; margin:0 auto; padding:22px; position:relative; }

  .breadcrumb { display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin-bottom:18px; min-height:28px; }
  .crumb { font-size:19px; font-weight:700; letter-spacing:-0.3px; color:var(--text-2); background:transparent; border:none; padding:3px 7px; border-radius:7px; transition:all .12s; }
  .crumb:hover { background:var(--hover); color:var(--text); }
  .crumb.active { color:var(--text); cursor:default; }
  .crumb.active:hover { background:transparent; }
  .crumb-sep { color:var(--text-3); font-size:16px; margin:0 1px; }

  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .toolbar-actions { display:flex; gap:9px; }
  .toolbar-right { display:flex; align-items:center; gap:14px; }
  .btn { display:inline-flex; align-items:center; gap:7px; border-radius:9px; font-size:13px; font-weight:600; padding:9px 15px; border:none; transition:all .15s; }
  .btn svg { width:16px; height:16px; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover { background:var(--blue-hover); }
  [data-theme="dark"] .btn-primary { color:#08254f; }
  .btn-ghost { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  .btn-ghost:hover { background:var(--hover); border-color:var(--border-2); }
  .btn-danger { background:var(--red-soft); color:var(--red); border:1px solid transparent; }
  .btn-danger:hover { background:var(--red); color:#fff; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .item-count { font-size:13px; color:var(--text-3); font-weight:500; }

  .view-toggle { display:inline-flex; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:2px; }
  .vt-btn { width:32px; height:30px; border:none; background:transparent; border-radius:7px; color:var(--text-3); display:flex; align-items:center; justify-content:center; transition:all .12s; }
  .vt-btn svg { width:16px; height:16px; }
  .vt-btn.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }

  .selbar { display:none; align-items:center; gap:10px; background:var(--blue-soft); border:1px solid color-mix(in srgb, var(--blue) 30%, transparent); border-radius:11px; padding:10px 14px; margin-bottom:14px; }
  .selbar.show { display:flex; }
  .selbar-count { font-size:13px; font-weight:600; color:var(--blue); flex:1; }
  [data-theme="dark"] .selbar-count { color:var(--text); }

  /* LIST */
  .list { background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-sm); }
  .list-head { display:grid; grid-template-columns:42px 1fr 150px 100px 44px; padding:0 8px 0 14px; height:40px; align-items:center; border-bottom:1px solid var(--border); font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--text-3); }
  .col-r { text-align:right; }
  .row { display:grid; grid-template-columns:42px 1fr 150px 100px 44px; padding:0 8px 0 14px; height:54px; align-items:center; border-bottom:1px solid var(--border); transition:background .1s; cursor:pointer; user-select:none; }
  .row:last-child { border-bottom:none; border-radius:0 0 12px 12px; }
  .row:hover { background:var(--hover); }
  .row.sel { background:var(--selected); }
  .cell-check { display:flex; align-items:center; }
  .check { width:18px; height:18px; border-radius:5px; border:2px solid var(--border-2); background:var(--surface); display:flex; align-items:center; justify-content:center; transition:all .12s; opacity:0; flex-shrink:0; }
  .row:hover .check, .check.on, .list.has-sel .check { opacity:1; }
  .check.on { background:var(--blue); border-color:var(--blue); }
  .check svg { width:12px; height:12px; color:#fff; display:none; }
  .check.on svg { display:block; }
  .cell-name { display:flex; align-items:center; gap:12px; min-width:0; padding-right:14px; }
  .cell-name .ico { width:30px; height:30px; flex-shrink:0; }
  .cell-name .nm { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell-mod, .cell-size { font-size:13px; color:var(--text-2); }
  .cell-size { text-align:right; padding-right:6px; }
  .cell-act { display:flex; justify-content:center; }
  .menu-btn { width:30px; height:30px; border-radius:8px; background:transparent; border:none; color:var(--text-2); display:flex; align-items:center; justify-content:center; opacity:0; transition:all .12s; font-size:18px; line-height:1; }
  .row:hover .menu-btn, .card:hover .menu-btn { opacity:1; }
  .menu-btn:hover { background:var(--border); color:var(--text); }

  /* GRID */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; padding:16px; }
  .card { position:relative; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); cursor:pointer; transition:all .12s; }
  .card:hover { border-color:var(--border-2); box-shadow:var(--shadow-sm); }
  .card.sel { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .card-thumb { height:118px; display:flex; align-items:center; justify-content:center; background:var(--panel); }
  .card-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-thumb .ico { width:46px; height:46px; }
  .card-foot { display:flex; align-items:center; gap:8px; padding:9px 10px; border-top:1px solid var(--border); }
  .card-foot .ico-sm { width:20px; height:20px; flex-shrink:0; }
  .card-foot .nm { font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-check { position:absolute; top:8px; left:8px; z-index:2; }
  .card-check .check { background:var(--surface); box-shadow:var(--shadow-sm); opacity:0; }
  .card:hover .card-check .check, .card-check .check.on, .grid.has-sel .card-check .check { opacity:1; }
  .card-menu { position:absolute; top:6px; right:6px; z-index:2; opacity:0; transition:opacity .12s; }
  .card:hover .card-menu { opacity:1; }
  .card-menu .menu-btn { background:var(--surface); box-shadow:var(--shadow-sm); opacity:1; }

  .state { text-align:center; padding:56px 24px; color:var(--text-3); }
  .state .ico { width:48px; height:48px; margin:0 auto 14px; opacity:.8; }
  .state p { font-size:14px; font-weight:500; }
  .state .hint { font-size:12.5px; color:var(--text-3); margin-top:4px; font-weight:400; }
  .spinner { width:22px; height:22px; border:2.5px solid var(--border-2); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin:40px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .drop-overlay { position:absolute; inset:22px; border:2.5px dashed var(--blue); border-radius:14px; background:var(--blue-soft); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:30; pointer-events:none; gap:12px; }
  .drop-overlay.show { display:flex; }
  .drop-overlay svg { width:44px; height:44px; color:var(--blue); }
  .drop-overlay p { font-size:16px; font-weight:600; color:var(--blue); }
  [data-theme="dark"] .drop-overlay p, [data-theme="dark"] .drop-overlay svg { color:var(--text); }

  .uploads { position:fixed; bottom:20px; right:20px; width:340px; max-width:calc(100vw - 40px); z-index:60; display:none; }
  .uploads.show { display:block; }
  .uploads-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .uploads-head { padding:12px 16px; font-size:13px; font-weight:600; border-bottom:1px solid var(--border); }
  .uploads-body { max-height:240px; overflow-y:auto; padding:8px 0; }
  .up-item { display:flex; align-items:center; gap:10px; padding:7px 16px; }
  .up-name { font-size:12.5px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .up-bar-wrap { width:70px; height:4px; background:var(--border); border-radius:2px; overflow:hidden; flex-shrink:0; }
  .up-bar { height:100%; width:0; background:var(--blue); transition:width .25s; }
  .up-pct { font-size:11px; color:var(--text-3); width:30px; text-align:right; flex-shrink:0; }
  .up-pct.done { color:var(--green); }
  .up-pct.fail { color:var(--red); }

  .ctx { position:fixed; z-index:100; min-width:184px; background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:var(--shadow); padding:6px; display:none; }
  .ctx.show { display:block; }
  .ctx-item { display:flex; align-items:center; gap:11px; width:100%; padding:9px 11px; border-radius:7px; border:none; background:transparent; color:var(--text); font-size:13.5px; font-weight:500; text-align:left; }
  .ctx-item:hover { background:var(--hover); }
  .ctx-item svg { width:16px; height:16px; color:var(--text-2); flex-shrink:0; }
  .ctx-item.danger { color:var(--red); }
  .ctx-item.danger svg { color:var(--red); }
  .ctx-sep { height:1px; background:var(--border); margin:5px 0; }

  .modal-bg { position:fixed; inset:0; background:var(--overlay); display:none; align-items:center; justify-content:center; z-index:90; padding:24px; }
  .modal-bg.show { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:400px; overflow:hidden; }
  .modal-head { padding:22px 24px 0; }
  .modal-title { font-size:17px; font-weight:700; }
  .modal-body { padding:16px 24px 0; }
  .modal-msg { font-size:13.5px; color:var(--text-2); line-height:1.55; }
  .modal-input { width:100%; margin-top:14px; padding:11px 13px; background:var(--bg); border:1.5px solid var(--border-2); border-radius:9px; color:var(--text); font-size:14px; font-family:inherit; outline:none; transition:border .15s; }
  .modal-input:focus { border-color:var(--blue); }
  .modal-foot { display:flex; justify-content:flex-end; gap:9px; padding:20px 24px 22px; }

  .move-nav { display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding:0 24px; margin-top:14px; min-height:26px; }
  .move-crumb { font-size:13px; font-weight:600; color:var(--text-2); background:transparent; border:none; padding:2px 6px; border-radius:6px; }
  .move-crumb:hover { background:var(--hover); color:var(--text); }
  .move-crumb.active { color:var(--text); }
  .move-list { margin:12px 24px 0; border:1px solid var(--border); border-radius:10px; max-height:260px; overflow-y:auto; }
  .move-row { display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--border); transition:background .1s; }
  .move-row:last-child { border-bottom:none; }
  .move-row:hover { background:var(--hover); }
  .move-row.disabled { opacity:.4; pointer-events:none; }
  .move-row .ico { width:24px; height:24px; }
  .move-row .nm { font-size:13.5px; font-weight:500; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .move-row .arr { color:var(--text-3); font-size:16px; }
  .move-empty { padding:28px; text-align:center; font-size:13px; color:var(--text-3); }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; z-index:110; opacity:0; pointer-events:none; transition:all .2s; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; max-width:calc(100vw - 32px); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg { width:16px; height:16px; flex-shrink:0; }

  @media (max-width:620px) {
    .list-head { grid-template-columns:38px 1fr 44px; }
    .list-head .col-mod, .list-head .col-size { display:none; }
    .row { grid-template-columns:38px 1fr 44px; }
    .cell-mod, .cell-size { display:none; }
    .container { padding:16px; }
    .crumb { font-size:16px; }
    .menu-btn { opacity:1; }
    .toolbar-actions .btn span { display:none; }
    .toolbar-actions .btn { padding:9px 11px; }
    .item-count { display:none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-brand">
    <svg class="login-logo" viewBox="0 0 32 32" fill="none">
      <path d="M9 5L3 9l6 4 6-4-6-4z" fill="#0061FF"/><path d="M23 5l-6 4 6 4 6-4-6-4z" fill="#0061FF"/>
      <path d="M3 17l6 4 6-4-6-4-6 4z" fill="#0061FF"/><path d="M23 13l-6 4 6 4 6-4-6-4z" fill="#0061FF"/>
      <path d="M9 22.5l6-4 6 4-6 4-6-4z" fill="#4C8DFF"/>
    </svg>
    <div class="login-title">MODELOS MULTI</div>
    <div class="login-sub">Portal de archivos</div>
  </div>
  <div class="pin-card">
    <div class="pin-label">Ingresá tu PIN</div>
    <div class="pin-dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key del" data-k="del">⌫</button><button class="key zero" data-k="0">0</button><div></div>
    </div>
    <div class="pin-hint">Escribí el PIN y presioná Enter</div>
    <div class="pin-err" id="pin-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hdr-left">
      <svg class="hdr-logo" viewBox="0 0 32 32" fill="none">
        <path d="M9 5L3 9l6 4 6-4-6-4z" fill="#0061FF"/><path d="M23 5l-6 4 6 4 6-4-6-4z" fill="#0061FF"/>
        <path d="M3 17l6 4 6-4-6-4-6 4z" fill="#0061FF"/><path d="M23 13l-6 4 6 4 6-4-6-4z" fill="#0061FF"/>
        <path d="M9 22.5l6-4 6 4-6 4-6-4z" fill="#4C8DFF"/>
      </svg>
      <span class="hdr-name">MODELOS MULTI</span>
    </div>
    <div class="hdr-right">
      <button class="icon-btn" id="theme-btn" title="Cambiar tema"></button>
      <button class="btn-text" id="logout-btn">Salir</button>
    </div>
  </header>

  <div class="container" id="container">
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="selbar" id="selbar">
      <span class="selbar-count" id="sel-count"></span>
      <button class="btn btn-ghost" id="sel-rename">Renombrar</button>
      <button class="btn btn-ghost" id="sel-move">Mover</button>
      <button class="btn btn-danger" id="sel-delete">Eliminar</button>
      <button class="btn btn-ghost" id="sel-cancel">Cancelar</button>
    </div>

    <div class="toolbar">
      <div class="toolbar-actions">
        <button class="btn btn-ghost" id="back-btn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span>Atrás</span>
        </button>
        <button class="btn btn-ghost" id="newfolder-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg><span>Nueva carpeta</span>
        </button>
        <button class="btn btn-primary" id="upload-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Subir</span>
        </button>
        <input type="file" id="file-input" multiple style="display:none">
      </div>
      <div class="toolbar-right">
        <div class="view-toggle">

function b64encPath(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64decPath(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }

(function detectGuest(){
  try {
    const f = new URLSearchParams(location.search).get('f');
    if(!f) return;
    const path = b64decPath(f);
    // Sólo se permite encerrar en carpetas dentro de la raíz de la cuenta.
    if(path.toLowerCase() !== ACCOUNT_ROOT.toLowerCase() && !path.toLowerCase().startsWith(ACCOUNT_ROOT.toLowerCase()+'/')) return;
    ROOT = path;
    ROOT_LABEL = path.split('/').filter(Boolean).pop() || 'Carpeta';

  } catch(e){ /* link inválido → se ignora y entra el modo normal con PIN */ }
})();

// ═══════════ DROPBOX API ═══════════
// Dropbox-API-Arg sólo admite ASCII; escapamos caracteres no-ASCII (acentos, ñ).
function dbxArg(obj){ return JSON.stringify(obj).replace(/[\u007f-\uffff]/g, c => '\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')); }

// El token de acceso dura ~4h. Con el refresh token pedimos uno nuevo automáticamente.
let accessToken = null, tokenExpiresAt = 0, refreshPromise = null;
async function refreshAccessToken(){
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
    method:'POST',
    headers:{ 'Authorization':'Basic '+btoa(APP_KEY+':'+APP_SECRET), 'Content-Type':'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token='+encodeURIComponent(REFRESH_TOKEN)
  });
  if(!r.ok){ let m=await r.text(); try{const j=JSON.parse(m); m=j.error_description||j.error_summary||j.error||m;}catch(e){} throw new Error('No se pudo renovar el acceso a Dropbox: '+m); }
  const d = await r.json();
  accessToken = d.access_token;
  tokenExpiresAt = Date.now() + ((d.expires_in||14400)*1000);
  return accessToken;
}
async function ensureToken(){
  if(accessToken && Date.now() < tokenExpiresAt - 5*60*1000) return accessToken;
  if(!refreshPromise) refreshPromise = refreshAccessToken().finally(()=>{ refreshPromise = null; });
  await refreshPromise;
  return accessToken;
}

async function dbx(endpoint, body){
  const tok = await ensureToken();
  const r = await fetch('https://api.dropboxapi.com/2/'+endpoint, {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!r.ok){
    let msg = await r.text();
    try { const j = JSON.parse(msg); msg = j.error_summary || msg; } catch(e){}
    throw new Error(msg);
  }
  return r.status === 204 ? {} : r.json();
}

async function dbxUpload(path, file, onProgress){
  const CHUNK = 8*1024*1024;
  if(file.size <= CHUNK){
    const tok = await ensureToken();
    const r = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': dbxArg({ path, mode:'add', autorename:true }) },
      body: await file.arrayBuffer()
    });
    if(!r.ok){ let m=await r.text(); try{m=JSON.parse(m).error_summary||m;}catch(e){} throw new Error(m); }
    onProgress(100); return;
  }
  const total = Math.ceil(file.size/CHUNK); let offset=0, sid=null;
  for(let i=0;i<total;i++){
    const tok = await ensureToken();
    const buf = await file.slice(offset, offset+CHUNK).arrayBuffer();
    if(i===0){
      const r = await fetch('https://content.dropboxapi.com/2/files/upload_session/start',{ method:'POST', headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': dbxArg({close:false}) }, body:buf });
      if(!r.ok){ let m=await r.text(); try{m=JSON.parse(m).error_summary||m;}catch(e){} throw new Error(m); }
      sid = (await r.json()).session_id;
    } else if(i < total-1){
      const r = await fetch('https://content.dropboxapi.com/2/files/upload_session/append_v2',{ method:'POST', headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': dbxArg({cursor:{session_id:sid,offset},close:false}) }, body:buf });
      if(!r.ok){ let m=await r.text(); try{m=JSON.parse(m).error_summary||m;}catch(e){} throw new Error(m); }
    } else {
      const r = await fetch('https://content.dropboxapi.com/2/files/upload_session/finish',{ method:'POST', headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': dbxArg({cursor:{session_id:sid,offset},commit:{path,mode:'add',autorename:true}}) }, body:buf });
      if(!r.ok){ let m=await r.text(); try{m=JSON.parse(m).error_summary||m;}catch(e){} throw new Error(m); }
    }
    offset += CHUNK;
    onProgress(Math.round(((i+1)/total)*100));
  }
}

async function getThumb(path){
  if(thumbCache[path]) return thumbCache[path];
  const tok = await ensureToken();
  const r = await fetch('https://content.dropboxapi.com/2/files/get_thumbnail_v2', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+tok, 'Dropbox-API-Arg': dbxArg({ resource:{'.tag':'path', path}, format:'jpeg', size:'w256h256', mode:'strict' }) }
  });
  if(!r.ok) throw new Error('no thumb');
  const url = URL.createObjectURL(await r.blob());
  thumbCache[path] = url; return url;
}

async function runLimited(arr, limit, fn){
  const out=[]; let i=0;
  const workers = Array(Math.min(limit, arr.length)).fill(0).map(async ()=>{
    while(i < arr.length){ const idx=i++; try{ out[idx]=await fn(arr[idx]); }catch(e){ out[idx]={__err:e.message||String(e)}; } }
  });
  await Promise.all(workers); return out;
}

// ═══════════ LOAD / RENDER ═══════════
async function loadFolder(path){
  currentPath = path; selected.clear(); updateSelbar(); updateBreadcrumb();
  $('back-btn').disabled = pathStack.length === 0;
  $('list').innerHTML = '<div class="spinner"></div>';
  try {
    const data = await dbx('files/list_folder', { path: path === '/' ? '' : path });
    items = data.entries.sort((a,b)=>{ if(a['.tag']!==b['.tag']) return a['.tag']==='folder'?-1:1; return a.name.localeCompare(b.name,'es'); });
    itemByLower = {}; items.forEach(it => itemByLower[it.path_lower]=it);
    render();
  } catch(e){
    $('list').innerHTML = `<div class="state"><div class="ico">${warnIcon}</div><p>No se pudo cargar</p><p class="hint">${escHtml(e.message)}</p></div>`;
  }
}

function render(){ renderSeq++; if(viewMode==='grid') renderGrid(); else renderList(); }

function setCount(){ $('item-count').textContent = items.length + (items.length===1?' elemento':' elementos'); }
function emptyHTML(){ return `<div class="state"><div class="ico">${folderOpenIcon}</div><p>Carpeta vacía</p><p class="hint">Arrastrá archivos aquí o usá el botón Subir</p></div>`; }
const checkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function renderList(){
  setCount();
  const list = $('list');
  if(items.length===0){ list.innerHTML = emptyHTML(); return; }
  list.innerHTML = `
    <div class="list-head">
      <div class="cell-check"><div class="check" id="check-all">${checkSVG}</div></div>
      <div>Nombre</div><div class="col-mod">Modificado</div><div class="col-size col-r">Tamaño</div><div></div>
    </div>
    ${items.map((it,i)=>{
      const folder = it['.tag']==='folder';
      const date = folder ? '—' : formatDate(it.client_modified || it.server_modified);
      const size = folder ? '—' : formatSize(it.size);
      const on = selected.has(it.path_lower)?'on':'';
      const sel = selected.has(it.path_lower)?'sel':'';
      return `<div class="row ${sel}" data-i="${i}">
        <div class="cell-check"><div class="check ${on}" data-act="check">${checkSVG}</div></div>
        <div class="cell-name"><span class="ico">${iconFor(it)}</span><span class="nm">${escHtml(it.name)}</span></div>
        <div class="cell-mod">${date}</div><div class="cell-size col-r">${size}</div>
        <div class="cell-act"><button class="menu-btn" data-act="menu">⋯</button></div>
      </div>`;
    }).join('')}`;
  list.classList.toggle('has-sel', selected.size>0);
}

function renderGrid(){
  setCount();
  const list = $('list'); const seq = renderSeq;
  if(items.length===0){ list.innerHTML = emptyHTML(); return; }
  list.classList.remove('has-sel');
  list.innerHTML = `<div class="grid ${selected.size?'has-sel':''}">${items.map((it,i)=>{
    const folder = it['.tag']==='folder';
    const on = selected.has(it.path_lower)?'on':'';
    const sel = selected.has(it.path_lower)?'sel':'';
    const big = folder ? folderIcon : iconFor(it);
    return `<div class="card ${sel}" data-i="${i}">
      <div class="card-check"><div class="check ${on}" data-act="check">${checkSVG}</div></div>
      <div class="card-menu"><button class="menu-btn" data-act="menu">⋯</button></div>
      <div class="card-thumb" id="thumb-${i}"><span class="ico">${big}</span></div>
      <div class="card-foot"><span class="ico-sm">${iconFor(it)}</span><span class="nm">${escHtml(it.name)}</span></div>
    </div>`;
  }).join('')}</div>`;
  // miniaturas reales para imágenes (lazy, máx 6 a la vez)
  const imgs = items.map((it,i)=>({it,i})).filter(x => x.it['.tag']==='file' && canThumb(x.it.name));
  runLimited(imgs, 6, async x => {
    try { const url = await getThumb(x.it.path_display); if(seq!==renderSeq) return; const el=$('thumb-'+x.i); if(el) el.innerHTML = `<img src="${url}" alt="" loading="lazy">`; } catch(e){}
  });
}

// delegación de clics (sirve para filas y tarjetas)
$('list').addEventListener('click', e => {
  if(e.target.closest('#check-all')){ toggleAll(); return; }
  const node = e.target.closest('[data-i]'); if(!node) return;
  const it = items[+node.dataset.i];
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(act==='check'){ toggleSelect(it); return; }
  if(act==='menu'){ openMenu(it, e.target.closest('.menu-btn')); return; }
  if(it['.tag']==='folder' && selected.size===0){ pathStack.push(currentPath); loadFolder(it.path_display); }
  else toggleSelect(it);
});

function toggleSelect(it){ if(selected.has(it.path_lower)) selected.delete(it.path_lower); else selected.add(it.path_lower); render(); updateSelbar(); }
function toggleAll(){ if(selected.size===items.length) selected.clear(); else items.forEach(it=>selected.add(it.path_lower)); render(); updateSelbar(); }
function clearSelection(){ selected.clear(); render(); updateSelbar(); }
function updateSelbar(){
  const n = selected.size;
  $('selbar').classList.toggle('show', n>0);
  $('sel-count').textContent = n + (n===1?' seleccionado':' seleccionados');
  $('sel-rename').style.display = n===1 ? 'inline-flex':'none';
  const all = $('check-all'); if(all) all.classList.toggle('on', n>0 && n===items.length);
}
$('sel-cancel').addEventListener('click', clearSelection);
$('sel-delete').addEventListener('click', ()=> deleteItems([...selected]));
$('sel-move').addEventListener('click', ()=> openMove([...selected]));

// ═══════════ NAVIGATION ═══════════
$('back-btn').addEventListener('click', ()=>{ if(pathStack.length) loadFolder(pathStack.pop()); });
function updateBreadcrumb(){
  const rel = currentPath.slice(ROOT.length).split('/').filter(Boolean);
  let html = `<button class="crumb ${rel.length===0?'active':''}" data-jump="0">${escHtml(ROOT_LABEL)}</button>`;
  let built = ROOT;
  rel.forEach((p,i)=>{ built += '/'+p; const last=i===rel.length-1; html += `<span class="crumb-sep">›</span><button class="crumb ${last?'active':''}" data-path="${escAttr(built)}">${escHtml(p)}</button>`; });
  $('breadcrumb').innerHTML = html;
}
$('breadcrumb').addEventListener('click', e => {
  const b = e.target.closest('.crumb'); if(!b || b.classList.contains('active')) return;
  if(b.dataset.jump==='0'){ pathStack=[]; loadFolder(ROOT); return; }
  const target = b.dataset.path;
  const rel = target.slice(ROOT.length).split('/').filter(Boolean);
  pathStack = [ROOT]; let built = ROOT;
  rel.forEach((p,i)=>{ if(i<rel.length-1){ built+='/'+p; pathStack.push(built); } });
  loadFolder(target);
});

// ═══════════ CONTEXT MENU ═══════════
function openMenu(it, btn){
  ctxItem = it; const folder = it['.tag']==='folder'; const ctx = $('ctx');
  ctx.innerHTML = `
    ${folder ? `<button class="ctx-item" data-m="open">${iconOpen}Abrir</button>` : `<button class="ctx-item" data-m="download">${iconDownload}Descargar</button>`}
    ${folder && !isGuest ? `<button class="ctx-item" data-m="share">${iconShare}Compartir carpeta…</button>` : ''}
    <button class="ctx-item" data-m="rename">${iconRename}Renombrar</button>
    <button class="ctx-item" data-m="move">${iconMove}Mover a…</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item danger" data-m="delete">${iconTrash}Eliminar</button>`;
  ctx.classList.add('show');
  const r = btn.getBoundingClientRect(); const cw=ctx.offsetWidth, ch=ctx.offsetHeight;
  let left = r.right - cw; if(left<8) left=8;
  let top = r.bottom + 6; if(top+ch > window.innerHeight-8) top = r.top - ch - 6;
  ctx.style.left = left+'px'; ctx.style.top = top+'px';
}
function closeMenu(){ $('ctx').classList.remove('show'); ctxItem = null; }
$('ctx').addEventListener('click', e => {
  const m = e.target.closest('[data-m]')?.dataset.m; if(!m || !ctxItem) return;
  const it = ctxItem; closeMenu();
  if(m==='open'){ pathStack.push(currentPath); loadFolder(it.path_display); }
  else if(m==='share') shareFolder(it);
  else if(m==='download') downloadFile(it);
  else if(m==='rename') renameItem(it);
  else if(m==='move') openMove([it.path_lower]);
  else if(m==='delete') deleteItems([it.path_lower]);
});
document.addEventListener('click', e => { if(!e.target.closest('#ctx') && !e.target.closest('.menu-btn')) closeMenu(); }, true);
window.addEventListener('scroll', closeMenu, true);
window.addEventListener('resize', closeMenu);

// ═══════════ ACTIONS ═══════════
function parentOf(path){ const i = path.lastIndexOf('/'); return i<=0 ? '' : path.slice(0,i); }

$('newfolder-btn').addEventListener('click', ()=>{
  inputModal('Nueva carpeta','Nombre de la carpeta','','Crear', async name=>{
    name = name.trim(); if(!name) return;
    try { await dbx('files/create_folder_v2', { path: currentPath+'/'+name, autorename:false }); toast('Carpeta creada','ok'); await loadFolder(currentPath); }
    catch(e){ toast(friendlyErr(e.message),'err'); }
  });
});
function renameItem(it){
  inputModal(it['.tag']==='folder'?'Renombrar carpeta':'Renombrar archivo','Nuevo nombre', it.name,'Guardar', async name=>{
    name = name.trim(); if(!name || name===it.name) return;
    try { await dbx('files/move_v2', { from_path: it.path_display, to_path: parentOf(it.path_display)+'/'+name, autorename:false }); toast('Renombrado','ok'); await loadFolder(currentPath); }
    catch(e){ toast(friendlyErr(e.message),'err'); }
  });
}
function deleteItems(lowers){
  const entries = lowers.map(l=>itemByLower[l]).filter(Boolean); const n = entries.length; if(!n) return;
  const hasFolder = entries.some(e=>e['.tag']==='folder');
  const what = n===1 ? `"${entries[0].name}"` : `${n} elementos`;
  const title = n===1 ? (entries[0]['.tag']==='folder'?'Eliminar carpeta':'Eliminar archivo') : 'Eliminar elementos';
  confirmModal(title, `¿Seguro que querés eliminar ${what}?` + (hasFolder?' Las carpetas se borran con todo su contenido.':'') + ' Esta acción no se puede deshacer.', 'Eliminar', true, async ()=>{
    const res = await runLimited(entries, 4, it => dbx('files/delete_v2', { path: it.path_display }));
    const fails = res.filter(r=>r&&r.__err);
    if(fails.length) toast(`${fails.length} no se pudieron eliminar — ${friendlyErr(fails[0].__err)}`,'err');
    else toast(n===1?'Eliminado':`${n} eliminados`,'ok');
    selected.clear(); await loadFolder(currentPath);
  });
}
async function downloadFile(it){
  try { const r = await dbx('files/get_temporary_link', { path: it.path_display }); const a=document.createElement('a'); a.href=r.link; a.download=it.name; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ toast(friendlyErr(e.message),'err'); }
}

// ═══════════ COMPARTIR CARPETA ═══════════
function shareFolder(it){
  const link = location.origin + location.pathname + '?f=' + b64encPath(it.path_display);
  $('modal').innerHTML = `
    <div class="modal-head"><div class="modal-title">Compartir "${escHtml(it.name)}"</div></div>
    <div class="modal-body">
      <p class="modal-msg">Quien abra este link entra directo a esta carpeta, sin PIN, y no puede salir de ella ni ver el resto del Dropbox. Tiene permisos completos dentro.</p>
      <input class="modal-input" id="share-link" value="${escAttr(link)}" readonly onclick="this.select()">
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mc">Cerrar</button>
      <button class="btn btn-primary" id="share-copy">Copiar link</button>
    </div>`;
  $('modal-bg').classList.add('show');
  $('mc').addEventListener('click', closeModal);
  $('share-copy').addEventListener('click', async ()=>{
    const inp = $('share-link');
    try { await navigator.clipboard.writeText(inp.value); }
    catch(e){ inp.select(); try{ document.execCommand('copy'); }catch(e2){} }
    $('share-copy').textContent = '¡Copiado!';
    setTimeout(()=>{ closeModal(); toast('Link copiado','ok'); }, 600);
  });
}

// ═══════════ MOVE PICKER ═══════════
function openMove(lowers){
  moveTargets = lowers.slice(); movePath = ROOT; moveStack = [];
  $('modal').innerHTML = `
    <div class="modal-head"><div class="modal-title">Mover ${lowers.length===1?'elemento':lowers.length+' elementos'}</div></div>
    <div class="move-nav" id="move-nav"></div>
    <div class="move-list" id="move-list"><div class="spinner"></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="move-cancel">Cancelar</button><button class="btn btn-primary" id="move-confirm">Mover aquí</button></div>`;
  $('modal-bg').classList.add('show');
  $('move-cancel').addEventListener('click', closeModal);
  $('move-confirm').addEventListener('click', confirmMove);
  $('move-nav').addEventListener('click', e=>{ const b=e.target.closest('.move-crumb'); if(!b) return; movePath=b.dataset.path; loadMove(); });
  $('move-list').addEventListener('click', e=>{ const row=e.target.closest('.move-row'); if(!row||row.classList.contains('disabled')) return; movePath=row.dataset.path; loadMove(); });
  loadMove();
}
async function loadMove(){
  const rel = movePath.slice(ROOT.length).split('/').filter(Boolean);
  let nav = `<button class="move-crumb ${rel.length===0?'active':''}" data-path="${escAttr(ROOT)}">${escHtml(ROOT_LABEL)}</button>`;
  let built = ROOT;
  rel.forEach((p,i)=>{ built += '/'+p; nav += `<span class="crumb-sep">›</span><button class="move-crumb ${i===rel.length-1?'active':''}" data-path="${escAttr(built)}">${escHtml(p)}</button>`; });
  $('move-nav').innerHTML = nav;
  $('move-list').innerHTML = '<div class="spinner"></div>';
  try {
    const data = await dbx('files/list_folder', { path: movePath });
    const folders = data.entries.filter(e=>e['.tag']==='folder').sort((a,b)=>a.name.localeCompare(b.name,'es'));
    if(!folders.length){ $('move-list').innerHTML = '<div class="move-empty">No hay subcarpetas aquí</div>'; return; }
    $('move-list').innerHTML = folders.map(f=>{
      const blocked = moveTargets.some(t => f.path_lower===t || f.path_lower.startsWith(t+'/'));
      return `<div class="move-row ${blocked?'disabled':''}" data-path="${escAttr(f.path_display)}"><span class="ico">${folderIcon}</span><span class="nm">${escHtml(f.name)}</span><span class="arr">›</span></div>`;
    }).join('');
  } catch(e){ $('move-list').innerHTML = `<div class="move-empty">${escHtml(e.message)}</div>`; }
}
async function confirmMove(){
  const dest = movePath;
  const entries = moveTargets.map(l=>itemByLower[l]).filter(Boolean);
  const valid = entries.filter(it => {
    if(parentOf(it.path_display).toLowerCase() === dest.toLowerCase()) return false;
    if(dest.toLowerCase()===it.path_lower || dest.toLowerCase().startsWith(it.path_lower+'/')) return false;
    return true;
  });
  if(!valid.length){ toast('No hay nada que mover ahí','err'); return; }
  $('move-confirm').disabled=true; $('move-confirm').textContent='Moviendo…';
  const res = await runLimited(valid, 4, it => dbx('files/move_v2', { from_path: it.path_display, to_path: dest+'/'+it.name, autorename:true }));
  const fails = res.filter(r=>r&&r.__err);
  closeModal();
  if(fails.length) toast(`${fails.length} no se pudieron mover — ${friendlyErr(fails[0].__err)}`,'err');
  else toast(valid.length===1?'Movido':`${valid.length} movidos`,'ok');
  selected.clear(); await loadFolder(currentPath);
}

// ═══════════ UPLOAD ═══════════
$('upload-btn').addEventListener('click', ()=> $('file-input').click());
$('file-input').addEventListener('change', e=>{ uploadFiles(e.target.files); e.target.value=''; });
const cont = $('container'); let dragDepth = 0;
cont.addEventListener('dragenter', e=>{ e.preventDefault(); if(e.dataTransfer.types.includes('Files')){ dragDepth++; $('drop-overlay').classList.add('show'); } });
cont.addEventListener('dragover', e=> e.preventDefault());
cont.addEventListener('dragleave', e=>{ dragDepth--; if(dragDepth<=0){ dragDepth=0; $('drop-overlay').classList.remove('show'); } });
cont.addEventListener('drop', e=>{ e.preventDefault(); dragDepth=0; $('drop-overlay').classList.remove('show'); if(e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

async function uploadFiles(fileList){
  const files = Array.from(fileList); if(!files.length) return;
  const box=$('uploads'), body=$('uploads-body');
  box.classList.add('show'); body.innerHTML='';
  $('uploads-title').textContent = `Subiendo ${files.length} archivo${files.length>1?'s':''}…`;
  const ids = {};
  files.forEach(f=>{ const id='u'+Math.random().toString(36).slice(2); ids[f.name]=id; body.insertAdjacentHTML('beforeend', `<div class="up-item"><span class="up-name">${escHtml(f.name)}</span><div class="up-bar-wrap"><div class="up-bar" id="${id}"></div></div><span class="up-pct" id="${id}p">0%</span></div>`); });
  let ok=0, fail=0, firstErr=null;
  await runLimited(files, 3, async file=>{
    const id = ids[file.name];
    try {
      await dbxUpload(currentPath+'/'+file.name, file, pct=>{ const b=$(id), p=$(id+'p'); if(b)b.style.width=pct+'%'; if(p)p.textContent=pct+'%'; });
      ok++; const p=$(id+'p'); if(p){ p.textContent='✓'; p.classList.add('done'); }
    } catch(e){ fail++; if(!firstErr) firstErr=e.message; const b=$(id), p=$(id+'p'); if(b){b.style.width='100%';b.style.background='var(--red)';} if(p){ p.textContent='✕'; p.classList.add('fail'); } }
  });
  if(fail){ $('uploads-title').textContent = `${ok} subidos · ${fail} fallidos`; toast(friendlyErr(firstErr),'err'); }
  else $('uploads-title').textContent = `${ok} subido${ok>1?'s':''} ✓`;
  setTimeout(()=>{ box.classList.remove('show'); body.innerHTML=''; }, fail?5000:2500);
  await loadFolder(currentPath);
}

// ═══════════ MODALS ═══════════
function inputModal(title, placeholder, value, confirmText, onConfirm){
  $('modal').innerHTML = `
    <div class="modal-head"><div class="modal-title">${escHtml(title)}</div></div>
    <div class="modal-body"><input class="modal-input" id="mi" placeholder="${escAttr(placeholder)}" value="${escAttr(value)}"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mc">Cancelar</button><button class="btn btn-primary" id="mo">${escHtml(confirmText)}</button></div>`;
  $('modal-bg').classList.add('show');
  const inp = $('mi'); inp.focus(); inp.select();
  const done = ()=>{ const v=inp.value; closeModal(); onConfirm(v); };
  $('mo').addEventListener('click', done);
  $('mc').addEventListener('click', closeModal);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') done(); if(e.key==='Escape') closeModal(); });
}
function confirmModal(title, msg, confirmText, danger, onConfirm){
  $('modal').innerHTML = `
    <div class="modal-head"><div class="modal-title">${escHtml(title)}</div></div>
    <div class="modal-body"><p class="modal-msg">${escHtml(msg)}</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mc">Cancelar</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="mo">${escHtml(confirmText)}</button></div>`;
  $('modal-bg').classList.add('show');
  $('mo').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
  $('mc').addEventListener('click', closeModal);
}
function closeModal(){ $('modal-bg').classList.remove('show'); $('modal').innerHTML=''; }
$('modal-bg').addEventListener('click', e=>{ if(e.target===$('modal-bg')) closeModal(); });

// ═══════════ TOAST ═══════════
let toastT;
function toast(msg, type){
  const t = $('toast');
  const ic = type==='ok' ? '<svg viewBox="0 0 24 24" fill="none" stroke="#3BD37E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : type==='err' ? '<svg viewBox="0 0 24 24" fill="none" stroke="#FF6B5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' : '';
  t.innerHTML = ic + '<span>'+escHtml(msg)+'</span>';
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('show'), 4000);
}

// ═══════════ UTILS ═══════════
function formatDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'}); }
function formatSize(b){ if(b==null) return '—'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; if(b<1073741824) return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return escHtml(s).replace(/'/g,'&#39;'); }
function friendlyErr(m){
  m = (m||'').toLowerCase();
  if(m.includes('renovar') || m.includes('refresh')) return 'No se pudo renovar el acceso a Dropbox. Revisá que las credenciales sigan válidas.';
  if(m.includes('missing_scope') || m.includes('scope')) return 'Falta un permiso (scope) en la app de Dropbox. Activalo en la pestaña Permisos.';
  if(m.includes('expired') || m.includes('invalid_access_token') || m.includes('invalid_token') || m.includes('401')) return 'Sesión expirada — recargá la página.';
  if(m.includes('conflict')) return 'Ya existe algo con ese nombre';
  if(m.includes('insufficient_space') || m.includes('no_write_permission')) return 'No hay espacio o permiso de escritura en Dropbox';
  if(m.includes('malformed') || m.includes('invalid_path') || m.includes('disallowed')) return 'Nombre o ruta no válidos';
  return 'Algo salió mal: ' + (m.slice(0,80) || 'error desconocido');
}
function canThumb(name){ const e=(name.split('.').pop()||'').toLowerCase(); return ['jpg','jpeg','png','gif','bmp','tiff','tif','webp'].includes(e); }

const warnIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

function doc(body, fold, mark){ return `<svg viewBox="0 0 32 40" width="100%" height="100%"><path d="M7 3h12l7 7v25a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="${body}"/><path d="M19 3l7 7h-5a2 2 0 0 1-2-2V3z" fill="${fold}"/>${mark}</svg>`; }
const mkLines = '<rect x="11" y="22" width="10" height="2" rx="1" fill="#fff" opacity=".9"/><rect x="11" y="27" width="10" height="2" rx="1" fill="#fff" opacity=".9"/><rect x="11" y="32" width="6" height="2" rx="1" fill="#fff" opacity=".9"/>';
const mkImg = '<circle cx="13.5" cy="22" r="2.2" fill="#fff"/><path d="M9 33l4.5-6 3 3.5 3.5-4.5 4 7z" fill="#fff" opacity=".95"/>';
const mkPlay = '<path d="M13 24v9l8-4.5z" fill="#fff"/>';
const mkNote = '<path d="M20 21l-7 1.6V31a2.4 2.4 0 1 1-1.6-2.27V24l8.6-2v-1z" fill="#fff"/>';
function iconFor(it){
  if(it['.tag']==='folder') return folderIcon;
  const ext = (it.name.split('.').pop()||'').toLowerCase();
  const img=['jpg','jpeg','png','gif','webp','heic','bmp','tif','tiff','svg','raw','cr2','cr3','nef','arw','dng'];
  const vid=['mp4','mov','avi','mkv','webm','m4v','wmv','flv']; const aud=['mp3','wav','aac','flac','ogg','m4a']; const arc=['zip','rar','7z','tar','gz'];
  if(img.includes(ext)) return doc('#2FBF6B','#28A85D',mkImg);
  if(vid.includes(ext)) return doc('#8B5CF6','#7C4DE0',mkPlay);
  if(aud.includes(ext)) return doc('#EC4899','#DB2777',mkNote);
  if(ext==='pdf') return doc('#EF4444','#DC2626',mkLines);
  if(arc.includes(ext)) return doc('#F59E0B','#D97706',mkLines);
  if(['doc','docx'].includes(ext)) return doc('#2B6CB0','#22568F',mkLines);
  if(['xls','xlsx','csv'].includes(ext)) return doc('#1F8A4C','#176B3B',mkLines);
  if(['ppt','pptx'].includes(ext)) return doc('#DD6B20','#B85617',mkLines);
  return doc('#94A3B8','#7D8A9C',mkLines);
}
